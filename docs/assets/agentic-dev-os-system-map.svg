<text x="105" y="272" class="label">01 · PRODUCT INTENT</text><text x="105" y="310" class="h">Choose the right work</text><g class="body"><rect x="105" y="345" width="290" height="48" rx="12" fill="#0d263a"/><text x="130" y="376">Outcome + target</text><rect x="105" y="408" width="290" height="48" rx="12" fill="#0d263a"/><text x="130" y="439">Evidenced opportunity</text><rect x="105" y="471" width="290" height="48" rx="12" fill="#0d263a"/><text x="130" y="502">Validated bet</text><rect x="105" y="534" width="290" height="48" rx="12" fill="#0d263a"/><text x="130" y="565">PRD + spec + milestone</text></g>
<text x="555" y="272" class="label">02 · BOUNDED AGENT LOOP</text><text x="555" y="310" class="h">Control the change</text><circle cx="700" cy="425" r="84" fill="#171733" stroke="#9a7ce8" stroke-width="2"/><text x="700" y="412" text-anchor="middle" class="body" font-weight="700">Ticket</text><text x="700" y="440" text-anchor="middle" class="small">scope · risk · verify</text><path d="M700 337c115 0 135 153 50 183" fill="none" stroke="#9a7ce8" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 520c-110-30-85-180 0-183" fill="none" stroke="#9a7ce8" stroke-width="4" marker-end="url(#arrow)"/><text x="585" y="558" class="small">plan → implement → verify → stop / handoff</text>
<text x="1005" y="272" class="label">03 · TRACEABLE EVIDENCE</text><text x="1005" y="310" class="h">Explain the result</text><g class="body"><rect x="1005" y="345" width="290" height="48" rx="12" fill="#0b2b28"/><text x="1030" y="376">Tests + CI gates</text><rect x="1005" y="408" width="290" height="48" rx="12" fill="#0b2b28"/><text x="1030" y="439">Events + metrics</text><rect x="1005" y="471" width="290" height="48" rx="12" fill="#0b2b28"/><text x="1030" y="502">Bidirectional trace</text><rect x="1005" y="534" width="290" height="48" rx="12" fill="#0b2b28"/><text x="1030" y="565">Human outcome review</text></g><line x1="438" y1="415" x2="505" y2="415" stroke="#8ea9d7" stroke-width="4" marker-end="url(#arrow)"/><line x1="888" y1="415" x2="955" y2="415" stroke="#8ea9d7" stroke-width="4" marker-end="url(#arrow)"/>
