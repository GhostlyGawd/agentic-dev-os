<g class="s"><text x="70" y="78" class="label">AGENTIC DEVELOPMENT OPERATING SYSTEM</text><text x="70" y="122" class="h" font-size="38">Intent in. Bounded work. Evidence out.</text><text x="70" y="158" class="body">Repository-native governance and traceability for AI-assisted software delivery</text><rect x="1090" y="64" width="240" height="44" rx="22" fill="#211b3f" stroke="#8d73ff"/><text x="1210" y="92" text-anchor="middle" class="chip">LAB · CANDIDATE · 1.1.0 SOURCE</text>
