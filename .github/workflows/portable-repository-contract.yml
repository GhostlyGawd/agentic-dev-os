name: Portable Repository Contract

on:
  workflow_call:
    inputs:
      profile_path:
        description: Repository-relative portfolio profile path
        required: false
        type: string
        default: portfolio-profile.json
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile_path:
        description: Repository-relative portfolio profile path
        required: false
        type: string
        default: portfolio-profile.json

permissions:
  contents: read

jobs:
  validate:
    name: Portable contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate profile and portability
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PROFILE_PATH: ${{ inputs.profile_path || 'portfolio-profile.json' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          IDS = ("ADO-PORT-001", "ADO-PORT-002", "ADO-PORT-003", "ADO-PORT-004", "ADO-PORT-005", "ADO-PORT-006")
          status = {item: "PASS" for item in IDS}
          root = Path.cwd().resolve()

          def classify(text):
              found = set()
              if re.search(r"\b" + "local" + r"host\b", text, re.IGNORECASE):
                  found.add("ADO-PORT-002")
              if re.search(r"\b" + "local" + "_" + r"proxy\b", text, re.IGNORECASE):
                  found.add("ADO-PORT-003")
              user_path = re.compile(
                  r"""(?ix)
                  (?:\b[A-Z]:[\\/](?:Users|Documents[ ]and[ ]Settings)[\\/][^\\/\s"'<>]+)
                  |(?:(?<![\w])/(?:Users|home)/[^/\s"'<>]+)
                  |(?:(?<![\w])/root/)
                  """
              )
              if user_path.search(text):
                  found.add("ADO-PORT-004")
              return found

          REQUIRED_PROFILE = {
              "schema_version": str,
              "repository": str,
              "purpose": str,
              "family": str,
              "lifecycle": str,
              "maturity": str,
              "investment": str,
              "disposition": str,
              "visibility_intent": str,
              "owner": str,
              "lineage": list,
              "data_classification": str,
              "capability_role": str,
              "portfolio_standard_ref": str,
              "harness_ref": str,
          }

          def valid_profile(profile, expected_repository):
              try:
                  if any(not isinstance(profile.get(key), kind) for key, kind in REQUIRED_PROFILE.items()):
                      return False
                  if profile["schema_version"] != "1.0":
                      return False
                  if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", profile["repository"]):
                      return False
                  if not expected_repository or profile["repository"].casefold() != expected_repository.casefold():
                      return False
                  if profile["lifecycle"] not in {"proposed", "active", "paused", "superseded", "archived"}:
                      return False
                  if profile["maturity"] not in {"lab", "beta", "stable"}:
                      return False
                  if profile["investment"] not in {"flagship", "supported", "incubating", "maintenance-only", "none"}:
                      return False
                  if profile["disposition"] not in {"public-product", "private-operational", "extract-and-publish", "archive"}:
                      return False
                  if profile["data_classification"] not in {"public", "internal", "confidential", "restricted"}:
                      return False
                  if not all(isinstance(item, str) and item for item in profile["lineage"]):
                      return False
                  return all(profile[key].strip() for key in REQUIRED_PROFILE if key != "lineage")
              except (AttributeError, TypeError):
                  return False

          expected = {
              "ADO-PORT-002": "http://" + "local" + "host:3000",
              "ADO-PORT-003": "set " + "local" + "_" + "proxy" + "=1",
              "ADO-PORT-004": "C:" + "\\Users\\" + "pilot\\artifact",
          }
          if any(item not in classify(sample) for item, sample in expected.items()) or classify("portable.example"):
              status["ADO-PORT-005"] = "FAIL"

          profile_fixture = {
              "schema_version": "1.0",
              "repository": "Owner/Repo",
              "purpose": "fixture",
              "family": "fixture",
              "lifecycle": "active",
              "maturity": "lab",
              "investment": "supported",
              "disposition": "public-product",
              "visibility_intent": "fixture",
              "owner": "owner",
              "lineage": [],
              "data_classification": "public",
              "capability_role": "fixture",
              "portfolio_standard_ref": "fixture",
              "harness_ref": "fixture",
          }
          case_variant = dict(profile_fixture, repository="owner/repo")
          wrong_repository = dict(profile_fixture, repository="owner/other")
          missing_field = dict(profile_fixture)
          del missing_field["purpose"]
          invalid_maturity = dict(profile_fixture, maturity="archived")
          if (
              not valid_profile(profile_fixture, "Owner/Repo")
              or not valid_profile(case_variant, "Owner/Repo")
              or valid_profile(wrong_repository, "Owner/Repo")
              or valid_profile(missing_field, "Owner/Repo")
              or valid_profile(invalid_maturity, "Owner/Repo")
          ):
              status["ADO-PORT-006"] = "FAIL"

          try:
              candidate = (root / os.environ["PROFILE_PATH"]).resolve()
              if root not in candidate.parents or not candidate.is_file():
                  raise ValueError
              profile = json.loads(candidate.read_text(encoding="utf-8"))
              if not valid_profile(profile, os.environ["EXPECTED_REPOSITORY"]):
                  raise ValueError
          except (OSError, ValueError, json.JSONDecodeError):
              status["ADO-PORT-001"] = "FAIL"

          listed = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")
          excluded = {
              ".github/workflows/portable-repository-contract.yml",
          }
          for raw_path in listed:
              if not raw_path:
                  continue
              relative = raw_path.decode("utf-8", errors="surrogateescape")
              if relative in excluded or relative.startswith("tests/fixtures/portable-contract/"):
                  continue
              path = root / relative
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if len(data) > 2_000_000 or b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="ignore")
              for item in classify(text):
                  status[item] = "FAIL"

          for item in IDS:
              print(f"{item} {status[item]}")
          overall = "PASS" if all(value == "PASS" for value in status.values()) else "FAIL"
          print(f"ADO-PORT {overall}")
          raise SystemExit(0 if overall == "PASS" else 1)
          PY
