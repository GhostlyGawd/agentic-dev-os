name: Governance
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Full governance, lint, architecture, trace, tool, and test gates
        run: make verify
      - name: Enforce ticket scope and risk approval
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python ci/validate_pr_scope.py --body "$PR_BODY" --base "$BASE_REF"
      - name: Build metrics, alerts, and dashboard
        run: make metrics
      - name: Record CI evidence
        if: always()
        run: python scripts/ados.py emit --event ci.gate_completed --ticket SYSTEM --outcome ${{ job.status == 'success' && 'passed' || 'failed' }} --metadata '{"gate":"governance"}'
      - name: Upload governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence
          path: |
            docs/metrics/latest.md
            observability/reports/
            observability/alerts/latest.json
            observability/events/loops.jsonl
  maintenance-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: make audit
