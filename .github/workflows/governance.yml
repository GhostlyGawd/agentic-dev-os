name: Governance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Full governance, lint, architecture, trace, tool, and test gates
        run: make verify

      - name: Verify generated product views
        run: make product

      - name: Enforce ticket scope and risk approval
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python ci/validate_pr_scope.py --body "$PR_BODY" --base "$BASE_REF"

      - name: Build metrics, alerts, and dashboard
        run: make metrics

      - name: Record CI evidence
        if: always()
        run: python scripts/ados.py emit --event ci.gate_completed --ticket SYSTEM --outcome ${{ job.status == 'success' && 'passed' || 'failed' }} --metadata '{"gate":"governance"}'

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-evidence
          if-no-files-found: warn
          path: |
            docs/metrics/latest.md
            observability/reports/
            observability/alerts/latest.json
            observability/events/loops.jsonl

  maintenance-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: make audit
